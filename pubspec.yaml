name: prism_banner
description: >-
  Dismissible in-app announcement banners for Flutter — release notes, promos,
  and maintenance notices with persistence, scheduling, and theming. Part of
  the Prism package family.
version: 0.1.0
repository: https://github.com/awaisdev5765/prism_banner
issue_tracker: https://github.com/awaisdev5765/prism_banner/issues
topics:
  - banner
  - widget
  - ui
  - announcement

environment:
  sdk: ^3.9.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true